# AyuGram iOS — unsigned (fake-signed) IPA on Codemagic.
#
# Alternative to the GitHub Actions build (.github/workflows/build-ipa.yml) for when
# GitHub's hosted macOS runners are unavailable. Same steps: fetch submodules, write a
# non-App-Store build configuration, build with Bazel via Make.py (flavor `ayu`), collect
# the IPA. The IPA is unsigned — re-sign it with Sideloadly / AltStore / TrollStore.
#
# One-time setup (only you can do this part):
#   1. Sign up at codemagic.io and connect this GitHub repository (authorise the
#      Codemagic GitHub App for GramLtd/ayugram-ios).
#   2. In the app's settings the `ayugram-ios-ipa` workflow below is picked up from this
#      file. Optionally add env vars TELEGRAM_API_ID / TELEGRAM_API_HASH (group `telegram`)
#      to use your own api pair instead of Telegram's public one.
#   3. Start a build on branch claude/serene-galileo-fm9thu.
#
# Confirm the Xcode version in the Codemagic UI matches versions.json (26.6); adjust the
# `xcode:` field below if that exact version is not offered.

workflows:
  ayugram-ios-ipa:
    name: AyuGram iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.6
      groups:
        - telegram
    cache:
      cache_paths:
        - ~/telegram-bazel-cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/serene-galileo-fm9thu"
          include: true
    scripts:
      - name: Fetch submodules
        script: |
          set -e
          # Two submodules use repository-relative URLs that only resolve on Telegram's
          # own org; point them at the upstream copies, same as the GitHub workflow.
          git config --file .gitmodules submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config --file .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
      # Xcode is selected by the `xcode:` field under `environment` above — Codemagic
      # activates it, so there is no GitHub-style /Applications/Xcode_<ver>.app to pick
      # here. Just report which one is active.
      - name: Show Xcode
        script: |
          set -e
          xcode-select -p
          xcodebuild -version
      - name: Install Metal toolchain
        script: |
          set -e
          # Xcode 16+/26 no longer bundles the Metal toolchain; the GitHub runner images
          # ship it, Codemagic's do not, so the .metal shaders fail to compile with
          # "missing Metal Toolchain". Download it (no-op if already present).
          xcodebuild -downloadComponent MetalToolchain
      - name: Install ccache
        script: |
          set -e
          # TDLib's CMake build (third-party/td) uses ccache as the compiler launcher.
          # GitHub runners ship it; Codemagic's do not, so td_build fails with
          # "ccache: command not found" (exit 127). Install it, and symlink into
          # /usr/local/bin because Bazel runs that genrule with a fixed
          # PATH=/bin:/usr/bin:/usr/local/bin that excludes Homebrew's /opt/homebrew/bin.
          brew list ccache >/dev/null 2>&1 || brew install ccache
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(brew --prefix)/bin/ccache" /usr/local/bin/ccache
          /usr/local/bin/ccache --version | head -1
      - name: Write build configuration
        script: |
          set -e
          mkdir -p build-input
          python3 - <<'EOF'
          import json, os
          config = json.load(open("build-system/appstore-configuration.json"))
          if os.environ.get("TELEGRAM_API_ID") and os.environ.get("TELEGRAM_API_HASH"):
              config["api_id"] = os.environ["TELEGRAM_API_ID"]
              config["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          config["is_appstore_build"] = "false"
          config["enable_icloud"] = False
          config["enable_siri"] = False
          json.dump(config, open("build-input/ci-configuration.json", "w"), indent=2)
          EOF
      - name: Build
        script: |
          set -ex
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          build-system/XTGXcodeConfig.sh
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --configurationPath build-input/ci-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --flavor ayu \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_arm64
      - name: Collect IPA
        script: |
          set -e
          mkdir -p artifacts
          IPA=$(find -L bazel-out -path '*/bin/Telegram/Telegram.ipa' -print 2>/dev/null | head -1)
          [ -n "$IPA" ] || IPA=bazel-bin/Telegram/Telegram.ipa
          cp "$IPA" artifacts/AyuGram.ipa
          ls -la artifacts
      - name: Publish IPA to GitHub Release
        script: |
          set -e
          # Codemagic's own artifact download stalls for large IPAs on iOS Safari, so
          # publish the IPA to a GitHub Release instead — those download reliably on a
          # phone. Needs a GitHub token (env var GH_TOKEN, a classic PAT with `repo`
          # scope, added in Codemagic → Environment variables). Skipped if absent.
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN not set — skipping GitHub release upload."
            exit 0
          fi
          brew list gh >/dev/null 2>&1 || brew install gh
          export GH_TOKEN
          TAG="session-import-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" artifacts/AyuGram.ipa \
            --repo GramLtd/ayugram-ios \
            --target claude/serene-galileo-fm9thu \
            --title "AyuGram (session import) $TAG" \
            --notes "Unsigned AyuGram IPA built on Codemagic. Re-sign (Sideloadly / AltStore / TrollStore) and change the bundle id before installing."
          echo "Published release $TAG"
          gh release view "$TAG" --repo GramLtd/ayugram-ios --json assets --jq '.assets[].url'
    artifacts:
      - artifacts/AyuGram.ipa
